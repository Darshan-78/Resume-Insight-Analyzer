spring.application.name=resumeinsight

# Active profiles: default local development
spring.profiles.active=local

# JPA/Hibernate parameters
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# PostgreSQL Database environment hooks (overridden by DatabaseConfig programmatically if DATABASE_URL is set)
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Gemini API environment configuration
gemini.api.key=${GEMINI_API_KEY:}

# Optimize Tomcat threads and connection pool for low memory usage in container (512MB)
server.tomcat.threads.max=20
server.tomcat.max-connections=20
spring.datasource.hikari.maximum-pool-size=5